# Render.com free-tier deployment — backend only.
# Frontend is deployed separately on Vercel (see angular-btp-frontend/vercel.json).
#
# How to use:
#   1. Push gestion_entreprise/ to a GitHub repo.
#   2. Go to https://dashboard.render.com → New → Blueprint → connect the repo.
#   3. Render reads this file and creates the service automatically.
#   4. Set the secret env vars in the Render dashboard (DATABASE_URL, JWT_SECRET, etc.).

services:
  - type: web
    name: gestion-btp-backend
    runtime: docker
    # Path relative to repo root where the Dockerfile lives
    dockerfilePath: ./spring-boot-btp-backend/Dockerfile
    dockerContext: ./spring-boot-btp-backend
    plan: free          # 512 MB RAM, sleeps after 15 min of inactivity
    healthCheckPath: /api/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ── Set these manually in the Render dashboard ──────────────────────────
      # DATABASE_URL  →  jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Generate a strong random value: openssl rand -hex 32
      - key: JWT_SECRET
        generateValue: true

      # Gmail address and App Password used for sending emails
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # Your Vercel frontend URL, e.g. https://gestion-btp.vercel.app
      - key: FRONTEND_URL
        sync: false

      # Same as FRONTEND_URL plus mobile origins; comma-separated
      # e.g. https://gestion-btp.vercel.app,capacitor://localhost,ionic://localhost
      - key: CORS_ORIGINS
        sync: false

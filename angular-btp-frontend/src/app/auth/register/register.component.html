
<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-lg mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-8">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Créer un Compte</h2>
        <p class="text-gray-600 mt-2">Rejoignez la plateforme GestionBTP</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="form-label">Prénom</label>
            <input type="text" formControlName="firstName" class="input-control" placeholder="John">
          </div>
          <div>
            <label class="form-label">Nom</label>
            <input type="text" formControlName="lastName" class="input-control" placeholder="Doe">
          </div>
        </div>

        <div>
          <label class="form-label">Nom d'utilisateur</label>
          <input type="text" formControlName="username" class="input-control" placeholder="johndoe">
        </div>

        <div>
          <label class="form-label">Email</label>
          <input type="email" formControlName="email" class="input-control" placeholder="j.doe@example.com">
        </div>

        <div>
          <label class="form-label">Mot de passe</label>
          <input type="password" formControlName="password" class="input-control" placeholder="••••••••">
        </div>

        <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
          <span class="block sm:inline">{{ errorMessage }}</span>
        </div>

        <button
          type="submit"
          [disabled]="registerForm.invalid || isLoading"
          class="w-full btn-primary"
        >
          {{ isLoading ? 'Création en cours...' : 'Créer mon compte' }}
        </button>
      </form>

      <div class="mt-4 text-center">
        <p class="text-sm text-gray-600">
          Vous avez déjà un compte?
          <a routerLink="/login" class="text-blue-600 hover:underline">Connectez-vous</a>
        </p>
      </div>
    </div>
  </div>
</div>

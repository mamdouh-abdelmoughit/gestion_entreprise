<div class="min-h-screen bg-secondary-50 flex items-center justify-center p-4">
  <div class="w-full max-w-lg">
    <!-- Logo/Brand Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-600 rounded-xl shadow-lg mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-secondary-900 mb-1">GestionBTP</h1>
      <p class="text-secondary-500 text-sm">Gestion complète pour entreprises de BTP</p>
    </div>

    <!-- Main Card -->
    <div class="card p-8">
      <div class="text-center mb-6">
        <h2 class="text-xl font-semibold text-secondary-900">Créer un Compte</h2>
        <p class="text-secondary-500 mt-1 text-sm">Rejoignez la plateforme GestionBTP</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <input type="text" formControlName="firstName" 
                     class="form-input pl-10"
                     placeholder="John">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Nom</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <input type="text" formControlName="lastName" 
                     class="form-input pl-10"
                     placeholder="Doe">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Nom d'utilisateur</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <input type="text" formControlName="username" 
                   class="form-input pl-10"
                   placeholder="johndoe">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
            <input type="email" formControlName="email" 
                   class="form-input pl-10"
                   placeholder="j.doe@example.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input type="password" formControlName="password" 
                   class="form-input pl-10"
                   placeholder="••••••••">
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert-danger" role="alert">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="btn-primary w-full justify-center"
        >
          <span *ngIf="isLoading" class="spinner mr-2"></span>
          {{ isLoading ? 'Création en cours...' : 'Créer mon compte' }}
          <svg *ngIf="!isLoading" class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>

      <div class="mt-6 text-center">
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-secondary-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-3 bg-white text-secondary-400">ou</span>
          </div>
        </div>
        <p class="text-sm text-secondary-600">
          Vous avez déjà un compte ?
          <a routerLink="/login" class="text-primary-600 hover:text-primary-700 font-semibold ml-1">Connectez-vous</a>
        </p>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="mt-6 text-center text-xs text-secondary-400">
      <p>© 2026 GestionBTP - Tous droits réservés</p>
    </div>
  </div>
</div>

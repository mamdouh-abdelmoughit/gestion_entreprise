<div class="documents-container">
  <div class="documents-header">
    <h2 class="documents-title">📄 Documents</h2>
    <button *ngIf="isAdmin()" routerLink="/documents/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
      Nouveau Document
    </button>
  </div>

  <div class="documents-content">
    <h3 class="content-title">Liste des Documents</h3>

    <div *ngIf="isLoading" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Chargement...</p>
    </div>

    <div *ngIf="!isLoading && !error && documentsPage" class="table-container">
      <table class="min-w-full bg-white">
      <thead class="bg-gray-100">
      <tr>
        <th class="py-2 px-4 text-left">Nom</th>
        <th class="py-2 px-4 text-left">Type</th>
        <th class="py-2 px-4 text-left">Date d'Upload</th>
        <th class="py-2 px-4 text-right">Taille (ko)</th>
        <th class="py-2 px-4 text-left"></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let document of documentsPage.content" class="border-b">
        <td class="py-2 px-4 font-medium">{{ document.nom }}</td>
        <td class="py-2 px-4">{{ document.type }}</td>
        <td class="py-2 px-4">{{ document.dateUpload | date:'dd/MM/yyyy HH:mm' }}</td>
        <td class="py-2 px-4 text-right">{{ (document.taille / 1024) | number:'1.2-2' }}</td>
        <td class="py-2 px-4">
          <button (click)="viewDocument(document.id)" class="text-gray-600 hover:underline mr-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.575 3.01 9.963 7.823a1.012 1.012 0 010 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.575-3.01-9.963-7.823z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </button>
        <button (click)="downloadDocument(document.id, document.nom)" class="text-green-600 hover:underline mr-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
        </svg>
    </button>
          <button *ngIf="isAdmin()" [routerLink]="['/documents/edit', document.id]" class="text-blue-600 hover:underline mr-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6h4.75" />
        </svg>
    </button>
        <button *ngIf="isAdmin()" (click)="deleteDocument(document.id)" class="text-red-600 hover:underline">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.945a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m-1.022.165L5.26 19.673a2.25 2.25 0 002.244 2.077h8.945a2.25 2.25 0 002.244-2.077L19.5 5.79m-14.456 0c.34-.059.68-.114 1.022-.165M16.5 6V4.75A2.25 2.25 0 0014.25 2.5h-4.5A2.25 2.25 0 007.5 4.75V6" />
        </svg>
    </button>
        </td>
      </tr>
      </tbody>
    </table>
      <app-pagination
        [page]="documentsPage"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>

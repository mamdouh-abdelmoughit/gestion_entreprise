<div class="min-h-screen bg-secondary-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-success-600 rounded-xl shadow-lg mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-secondary-900 mb-1">GestionBTP</h1>
      <p class="text-secondary-500 text-sm">Activation de votre compte</p>
    </div>

    <!-- ── Success state ───────────────────────────────────────────────── -->
    <div *ngIf="success" class="card p-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h2 class="text-xl font-semibold text-secondary-900 mb-2">Compte activé !</h2>
      <p class="text-secondary-500 text-sm mb-6">
        Votre mot de passe a été défini avec succès.<br>
        Connectez-vous maintenant avec vos identifiants.
      </p>
      <button (click)="goToLogin()" class="btn-primary w-full justify-center">
        Se connecter
      </button>
    </div>

    <!-- ── Activation form ─────────────────────────────────────────────── -->
    <div *ngIf="!success" class="card p-8">
      <div class="text-center mb-6">
        <h2 class="text-xl font-semibold text-secondary-900">Définir votre mot de passe</h2>
        <p class="text-secondary-500 mt-1 text-sm">Choisissez un mot de passe sécurisé pour accéder à votre compte</p>
      </div>

      <form (ngSubmit)="submit()" class="space-y-5">
        <div class="form-group">
          <label class="form-label">Nouveau mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input [(ngModel)]="password" name="password" type="password"
                   class="form-input pl-10" placeholder="••••••••" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirmer le mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
            </div>
            <input [(ngModel)]="confirm" name="confirm" type="password"
                   class="form-input pl-10" placeholder="••••••••" required>
          </div>
        </div>

        <div *ngIf="error" class="alert-danger">{{ error }}</div>

        <button type="submit" class="btn-success w-full justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Activer mon compte
        </button>
      </form>
    </div>

    <div class="mt-6 text-center text-xs text-secondary-400">
      <p>© 2026 GestionBTP - Tous droits réservés</p>
    </div>
  </div>
</div>

<div class="cautions-container">
  <div class="cautions-header">
    <h2 class="cautions-title">💰 Cautions</h2>
    <button *ngIf="isAdmin()" routerLink="/cautions/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
      Nouvelle Caution
    </button>
  </div>

  <div class="cautions-content">
    <h3 class="content-title">Liste des Cautions</h3>

    <div *ngIf="isLoading" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Chargement...</p>
    </div>

    <div *ngIf="!isLoading && !error && cautionsPage" class="table-container">
      <table class="min-w-full bg-white">
        <thead class="bg-gray-100">
        <tr>
          <!-- FIX: Added header for Numero -->
          <th class="py-2 px-4 text-left">Numéro</th>
          <th class="py-2 px-4 text-left">Type</th>
          <th class="py-2 px-4 text-left">Montant</th>
          <th class="py-2 px-4 text-left">Date d'Échéance</th>
          <th class="py-2 px-4 text-left">Statut</th>
          <th class="py-2 px-4 text-left"></th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let caution of cautionsPage.content" class="border-b">
          <!-- FIX: Changed caution.nom to the correct property, caution.numero -->
          <td class="py-2 px-4 font-medium">{{ caution.numero }}</td>
          <td class="py-2 px-4">{{ caution.type }}</td>
          <td class="py-2 px-4">{{ caution.montant | currency:'EUR' }}</td>
          <td class="py-2 px-4">{{ caution.dateEcheance | date:'dd/MM/yyyy' }}</td>
          <td class="py-2 px-4">
        <span class="px-2 py-1 text-xs rounded-full"
              [ngClass]="{
                'bg-green-200 text-green-800': caution.statut === 'ACTIVE',
                'bg-red-200 text-red-800': caution.statut === 'EXPIREE',
                'bg-gray-200 text-gray-800': caution.statut === 'RESTITUEE',
                'bg-orange-200 text-orange-800': caution.statut === 'CONFISQUEE'
              }">
          {{ caution.statut }}
        </span>
          </td>
          <td class="py-2 px-4">
        
     <button [routerLink]="['/cautions/details', caution.id]" class="text-gray-600 hover:underline mr-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.575 3.01 9.963 7.823a1.012 1.012 0 010 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.575-3.01-9.963-7.823z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </button>
    <button *ngIf="isAdmin()" [routerLink]="['/cautions/edit', caution.id]" class="text-blue-600 hover:underline mr-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6h4.75" />
        </svg>
    </button>
            <button *ngIf="isAdmin()" (click)="deleteCaution(caution.id)" class="text-red-600 hover:underline">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.945a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m-1.022.165L5.26 19.673a2.25 2.25 0 002.244 2.077h8.945a2.25 2.25 0 002.244-2.077L19.5 5.79m-14.456 0c.34-.059.68-.114 1.022-.165M16.5 6V4.75A2.25 2.25 0 0014.25 2.5h-4.5A2.25 2.25 0 007.5 4.75V6" />
        </svg>
    </button>
          </td>
        </tr>
        </tbody>
      </table>
      <app-pagination
        [page]="cautionsPage"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>

<header class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-10">
  <div class="flex justify-between items-center">
    <!-- Left side: Application Title -->
    <div>
      <h1 class="text-xl font-bold text-secondary-900">
        Gestion BTP & Marchés Publics
      </h1>
      <p class="text-xs text-secondary-500 mt-0.5">
        Plateforme de gestion pour entreprises de BTP au Maroc
      </p>
    </div>

    <!-- Right side: User Info and Actions -->
    <div class="flex items-center gap-4">
      <!-- User Info -->
      <div class="flex items-center gap-3 px-4 py-2 bg-gray-50 rounded-lg border border-gray-100">
        <div class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center">
          <svg class="w-4 h-4 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <div class="text-sm">
          <p class="font-medium text-secondary-800">{{ currentUser?.username || userEmail || 'Utilisateur' }}</p>
          <span class="text-xs px-2 py-0.5 rounded-full" [ngClass]="getRoleBadgeClass()">
            {{ getRoleDisplay() }}
          </span>
        </div>
      </div>

      <!-- Logout Button -->
      <button 
        (click)="logout()" 
        class="btn-secondary btn-sm flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Déconnexion
      </button>
    </div>
  </div>
</header>

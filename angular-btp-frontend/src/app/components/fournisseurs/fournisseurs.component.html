<div class="fournisseurs-container">
  <div class="fournisseurs-header">
    <h2 class="fournisseurs-title">🏢 Fournisseurs</h2>
    <button routerLink="/fournisseurs/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
      Nouveau Fournisseur
    </button>
  </div>

  <div class="fournisseurs-content">
    <h3 class="content-title">Liste des Fournisseurs</h3>

    <div *ngIf="isLoading" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Chargement...</p>
    </div>

    <div *ngIf="!isLoading && !error && fournisseursPage" class="overflow-x-auto">
      <table class="min-w-full bg-white">
        <thead class="bg-gray-100">
          <tr>
            <th class="py-2 px-4 text-left">Nom</th>
            <th class="py-2 px-4 text-left">Email</th>
            <th class="py-2 px-4 text-left">Téléphone</th>
            <th class="py-2 px-4 text-left">Statut</th>
            <th class="py-2 px-4 text-left"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let fournisseur of fournisseursPage.content" class="border-b">
            <td class="py-2 px-4 font-medium">{{ fournisseur.nom }}</td>
            <td class="py-2 px-4">{{ fournisseur.email }}</td>
            <td class="py-2 px-4">{{ fournisseur.telephone }}</td>
            <td class="py-2 px-4">
              <span class="px-2 py-1 text-xs font-semibold rounded-full"
                    [ngClass]="{
                      'bg-green-200 text-green-800': fournisseur.statut === 'ACTIF',
                      'bg-red-200 text-red-800': fournisseur.statut === 'INACTIF' || fournisseur.statut === 'SUSPENDU',
                      'bg-yellow-200 text-yellow-800': fournisseur.statut === 'EN_ATTENTE'
                    }">
                {{ fournisseur.statut }}
              </span>
            </td>
            <td class="py-2 px-4 flex items-center space-x-2">
              <button [routerLink]="['/fournisseurs/edit', fournisseur.id]" class="text-blue-600 hover:text-blue-800">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6h4.75" />
                </svg>
              </button>
              <button (click)="deleteFournisseur(fournisseur.id)" class="text-red-600 hover:text-red-800">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.945a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165M16.5 6V4.75A2.25 2.25 0 0014.25 2.5h-4.5A2.25 2.25 0 007.5 4.75V6M8.25 10.5h.008v.008H8.25v-.008zM12 10.5h.008v.008H12v-.008zM15.75 10.5h.008v.008H15.75v-.008z" />
                </svg>
              </button>
              <button [routerLink]="['/fournisseurs/details', fournisseur.id]" class="text-gray-600 hover:text-gray-800">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.575 3.01 9.963 7.823a1.012 1.012 0 010 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.575-3.01-9.963-7.823z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <app-pagination
        [page]="fournisseursPage"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>

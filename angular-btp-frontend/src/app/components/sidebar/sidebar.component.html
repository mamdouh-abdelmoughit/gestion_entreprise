<aside class="w-64 bg-white border-r border-gray-200 h-screen sticky top-0 flex flex-col">
  <!-- Brand Header -->
  <div class="p-5 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <div>
        <h2 class="text-lg font-bold text-secondary-900">GestionBTP</h2>
        <p class="text-xs text-secondary-500">Marchés & Chantiers</p>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 overflow-y-auto">
    <ul class="space-y-1">
      <li *ngFor="let module of modules">
        <button
          (click)="moduleChange.emit(module.id)"
          class="w-full text-left px-4 py-2.5 rounded-lg transition-all duration-200 flex items-center gap-3 text-sm font-medium"
          [ngClass]="{
            'bg-primary-50 text-primary-700 border-l-2 border-primary-600': activeModule === module.id,
            'text-secondary-600 hover:bg-gray-50 hover:text-secondary-900': activeModule !== module.id
          }"
        >
          <span class="text-lg" [innerHTML]="getModuleIcon(module.id)"></span>
          <span>{{ module.name }}</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-gray-100">
    <div class="text-xs text-secondary-400 text-center">
      <p>© 2026 GestionBTP</p>
      <p class="mt-0.5">v1.0.0</p>
    </div>
  </div>
</aside>

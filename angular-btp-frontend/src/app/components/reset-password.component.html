<div class="min-h-screen bg-secondary-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo/Brand Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-600 rounded-xl shadow-lg mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-secondary-900 mb-1">GestionBTP</h1>
      <p class="text-secondary-500 text-sm">Réinitialisation du mot de passe</p>
    </div>

    <!-- Main Card -->
    <div class="card p-8">
      <div class="text-center mb-6">
        <h2 class="text-xl font-semibold text-secondary-900">Nouveau mot de passe</h2>
        <p class="text-secondary-500 mt-1 text-sm">Choisissez un nouveau mot de passe sécurisé</p>
      </div>

      <form (ngSubmit)="submit()" class="space-y-5">
        <div class="form-group">
          <label class="form-label">Nouveau mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input [(ngModel)]="password" name="password" type="password"
                   class="form-input pl-10"
                   placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirmer le mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
            </div>
            <input [(ngModel)]="confirm" name="confirm" type="password"
                   class="form-input pl-10"
                   placeholder="••••••••" required>
          </div>
        </div>

        <div *ngIf="error" class="alert-danger">
          {{ error }}
        </div>

        <div *ngIf="success" class="alert-success">
          Mot de passe réinitialisé avec succès ! Redirection en cours...
        </div>

        <button type="submit" class="btn-primary w-full justify-center" [disabled]="success">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Réinitialiser le mot de passe
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/login" class="text-sm text-primary-600 hover:text-primary-700 font-medium">
          Retour à la connexion
        </a>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="mt-6 text-center text-xs text-secondary-400">
      <p>© 2026 GestionBTP - Tous droits réservés</p>
    </div>
  </div>
</div>

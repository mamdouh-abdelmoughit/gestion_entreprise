<div *ngIf="toast$ | async as toast"
     class="fixed top-5 right-5 z-50 p-4 rounded-md shadow-lg flex items-center"
     [ngClass]="toast.type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'">

  <span class="mr-4">{{ toast.message }}</span>

  <button (click)="close()" class="text-xl font-bold leading-none">&times;</button>
</div>

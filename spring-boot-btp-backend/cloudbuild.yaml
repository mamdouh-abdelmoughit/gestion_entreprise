# Google Cloud Build — builds the Docker image and deploys to Cloud Run.
#
# One-time setup (run these in Cloud Shell or locally with gcloud):
#
#   gcloud artifacts repositories create gestion-btp \
#     --repository-format=docker \
#     --location=${_REGION}
#
#   gcloud run services update gestion-btp-backend --region=${_REGION} \
#     --set-env-vars="SPRING_PROFILES_ACTIVE=prod,\
#       DATABASE_URL=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require,\
#       DB_USERNAME=postgres.qvarhogwgazpwzovbtqz,\
#       DB_PASSWORD=<your-db-password>,\
#       JWT_SECRET=<64-char-hex>,\
#       MAIL_HOST=smtp-relay.brevo.com,\
#       MAIL_USERNAME=<brevo-login>,\
#       MAIL_PASSWORD=<brevo-smtp-key>,\
#       SUPABASE_URL=https://<ref>.supabase.co,\
#       SUPABASE_SERVICE_KEY=<service-role-key>,\
#       SUPABASE_BUCKET=documents,\
#       FRONTEND_URL=https://<your-app>.vercel.app,\
#       CORS_ORIGINS=https://<your-app>.vercel.app"

substitutions:
  _REGION: europe-west1
  _SERVICE: gestion-btp-backend
  _REPO: gestion-btp

steps:
  # 1. Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --port=8080

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY

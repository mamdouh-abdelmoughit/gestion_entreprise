# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ─── Default active profile (overridden by env var in production) ─────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── JWT ──────────────────────────────────────────────────────────────────────
# In production, JWT_SECRET must be a cryptographically random 64-char string.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-replace-before-any-real-use-!!}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ─── Email ────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─── Frontend base URL (used in email links) ──────────────────────────────────
app.frontend.base-url=${FRONTEND_URL:http://localhost:4200}

# ─── CORS allowed origins (comma-separated) ───────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4000,http://127.0.0.1:4200}

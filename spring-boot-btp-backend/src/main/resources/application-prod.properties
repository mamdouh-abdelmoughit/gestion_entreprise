# ─── Production profile: PostgreSQL (Supabase) ────────────────────────────────
# DATABASE_URL format from Supabase: jdbc:postgresql://db.xxx.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' creates tables on first boot, then preserves data across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Email: enabled in prod (RealEmailService uses MAIL_* env vars) ──────────
app.email.enabled=true

# ─── Disable H2 console completely ────────────────────────────────────────────
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# ─── Storage: Supabase ────────────────────────────────────────────────────────
app.storage.type=supabase
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET:documents}

# ─── Production logging ───────────────────────────────────────────────────────
logging.level.com.btp=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

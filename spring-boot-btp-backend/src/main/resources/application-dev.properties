# ─── Dev profile: H2 in-memory database ──────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Email: enabled in dev using the Gmail App Password ──────────────────────
app.email.enabled=true
spring.mail.username=${MAIL_USERNAME:mamadouabdo29@gmail.com}
spring.mail.password=${MAIL_PASSWORD:puwjqdqijcrwxftj}
spring.mail.properties.mail.debug=false

# ─── Storage: local disk (uploads/ dir) ──────────────────────────────────────
app.storage.type=local
app.storage.local.path=uploads
app.backend.url=http://localhost:8080/api

# ─── Dev logging ──────────────────────────────────────────────────────────────
logging.level.com.btp=DEBUG
logging.level.org.springframework.security=DEBUG
